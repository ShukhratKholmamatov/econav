      cursor: none;
      transition: background-color 0.3s, color 0.3s;

    #seed-cursor {

      z-index: 10000; transform: rotate(-45deg);

      box-shadow: 0 0 15px rgba(38, 177, 177, 0.5);

    .bg-teal-brand { background-color: var(--bmb-teal); }
    .text-teal-brand { color: var(--bmb-teal); }
    .bg-navy-brand { background-color: var(--bmb-navy); }
    .text-navy-brand { color: var(--bmb-navy); }

    /* Keep only safe dark overrides */
    .dark nav { background-color: rgba(8, 26, 38, 0.9); border-color: #1e293b; }
    .dark .bg-slate-50 { background-color: #0a2333; }
    .dark select option { background-color: #0D324D; color: white; }

    .page-fade { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .active-nav { color: var(--bmb-teal) !important; border-bottom: 2px solid var(--bmb-teal); }
  </style>
</head>

     * - Default is ALWAYS LIGHT on first visit
     * - User choice is saved in localStorage
     * - No OS auto-dark forcing
     ***********************/
    const THEME_KEY = "bmb_theme";

    function applyTheme(theme) {
      const root = document.documentElement;
      if (theme === "dark") root.classList.add("dark");
      else root.classList.remove("dark");

      // helps browsers respect our chosen scheme
      root.style.colorScheme = theme === "dark" ? "dark" : "light";
      const meta = document.querySelector('meta[name="color-scheme"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "dark" : "light");

      updateThemeIcon();
    }

    function getSavedTheme() {
      return localStorage.getItem(THEME_KEY); // "dark" | "light" | null
    }

    function saveTheme(theme) {
      localStorage.setItem(THEME_KEY, theme);
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains("dark");
      const next = isDark ? "light" : "dark";
      saveTheme(next);
      applyTheme(next);
      lucide.createIcons();
    }

    function updateThemeIcon() {
      // optional: swap icon, not required
      const icon = document.getElementById("theme-icon");
      if (!icon) return;

      const isDark = document.documentElement.classList.contains("dark");
      icon.setAttribute("data-lucide", isDark ? "sun" : "moon");
    }

      const saved = getSavedTheme();
      // default: LIGHT (not based on OS)

      document.querySelectorAll('nav a').forEach(el => el.classList.remove('active-nav'));

        </div>
      `;

      document.getElementById('seed-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function bindForm() {
      const form = document.getElementById('tg-form');
      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text =
          `🌟 *Yangi xabar* 🌟\n` +
          `👤 *Ism:* ${document.getElementById('inp-name').value}\n` +
          `📞 *Tel:* ${document.getElementById('inp-phone').value}\n` +
          `💬 *Xabar:* ${document.getElementById('inp-msg').value}`;

        try {
          await fetch(`https://api.telegram.org/bot8258481366:AAHwxRFxpl092Wxkus3Ne-QLeg4HxBzmZ1g/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: "-4966032685", text: text, parse_mode: 'Markdown' })
          });
          alert("✅ Xabaringiz yuborildi!");
          e.target.reset();
        } catch (err) {
          alert("❌ Xatolik yuz berdi.");
        }
      });
    }

    function closeModal() {
      document.getElementById('seed-modal').classList.add('hidden');
    }

    function changeLanguage(l) {
      currentLang = l;
      navigateTo(currentPage);
    }

    const cursor = document.getElementById('seed-cursor');
    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    // first render icons + page after theme init
    lucide.createIcons();
    navigateTo('home');
  </script>
