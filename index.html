<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMB EcoNav | Innovative Agricultural Solutions</title>

  <meta name="color-scheme" content="light dark" />

  <!-- ✅ THEME BEFORE RENDER -->
  <script>
    (function () {
      const THEME_KEY = "bmb_theme";
      const saved = localStorage.getItem(THEME_KEY);
      const theme = saved === "dark" ? "dark" : "light"; // default light
      const root = document.documentElement;
      root.classList.toggle("dark", theme === "dark");
      root.style.colorScheme = theme;
    })();
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

    :root{
      --bmb-teal:#26B1B1;
      --bmb-navy:#0D324D;

      --bg:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --card:#ffffff;
      --border:#e2e8f0;

      --bg-soft:#f8fafc;
      --shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
      --shadow2: 0 18px 50px rgba(15, 23, 42, 0.16);
    }

    html.dark{
      --bg:#081a26;
      --text:#f1f5f9;
      --muted:#cbd5e1;
      --card:#0b2233;
      --border:#243447;
      --bg-soft: rgba(15, 23, 42, 0.35);
      --shadow: 0 20px 60px rgba(0,0,0,0.40);
      --shadow2: 0 18px 50px rgba(0,0,0,0.55);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:'Plus Jakarta Sans', sans-serif;
      background:var(--bg);
      color:var(--text);
      overflow-x:hidden;
      scroll-behavior:smooth;
      cursor:none;
      transition: background-color .25s ease, color .25s ease;
    }

    /* utilities */
    .container{ max-width: 1120px; margin:0 auto; padding: 0 24px; }
    .hidden{ display:none !important; }
    .fade{ animation: fadeIn .35s ease-in-out; }
    @keyframes fadeIn{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }

    .btn{
      border:0; cursor:pointer;
      padding: 14px 20px;
      border-radius: 999px;
      font-weight:800;
      letter-spacing:.02em;
      transition: transform .15s ease, opacity .15s ease, background-color .2s ease;
    }
    .btn:active{ transform: scale(0.98); }
    .btn-teal{ background: var(--bmb-teal); color:#fff; }
    .btn-navy{ background: var(--bmb-navy); color:#fff; border-radius: 18px; padding: 18px 28px; box-shadow: var(--shadow2); }
    .btn-navy:hover{ background: var(--bmb-teal); }

    /* cursor */
    #seed-cursor{
      width:20px; height:20px; background:var(--bmb-teal);
      border-radius:50% 0 50% 50%;
      position:fixed; pointer-events:none;
      z-index:10000; transform:rotate(-45deg);
      transition: transform .08s;
      box-shadow:0 0 15px rgba(38, 177, 177, 0.5);
    }

    /* navbar */
    .nav{
      position:fixed; inset:0 0 auto 0;
      z-index:50;
      background: rgba(255,255,255,0.90);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      transition: background-color .2s ease, border-color .2s ease;
    }
    html.dark .nav{ background: rgba(8,26,38,0.90); }
    .nav-inner{
      height: 68px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }
    .logo{ display:flex; align-items:center; gap:12px; text-decoration:none; }
    .logo img{ height:44px; width:auto; object-fit:contain; }

    .nav-links{
      display:none;
      align-items:center;
      gap:28px;
      font-weight:800;
      font-size: 13px;
    }
    .nav-links a{
      color: var(--muted);
      text-decoration:none;
      padding-bottom: 6px;
      transition: color .2s ease;
    }
    .nav-links a:hover{ color: var(--bmb-teal); }
    .nav-links a.active{
      color: var(--bmb-teal);
      border-bottom: 2px solid var(--bmb-teal);
    }

    .nav-actions{ display:flex; align-items:center; gap:10px; }
    .icon-btn{
      width:38px; height:38px;
      border-radius:999px;
      border:0;
      cursor:pointer;
      background: rgba(148,163,184,0.16);
      display:grid; place-items:center;
      transition: background .2s ease, transform .15s ease;
    }
    .icon-btn:hover{ background: rgba(148,163,184,0.22); }
    html.dark .icon-btn{ background: rgba(148,163,184,0.16); }
    html.dark .icon-btn:hover{ background: rgba(148,163,184,0.22); }

    .lang{
      border: 1px solid var(--border);
      background: rgba(148,163,184,0.16);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 10px;
      font-weight:800;
      font-size: 11px;
      letter-spacing:.08em;
      outline:none;
      text-transform: uppercase;
    }

    .top-contact{
      display:none;
      text-decoration:none;
      padding: 10px 16px;
      border-radius:999px;
      font-weight:800;
      font-size: 12px;
      color:#fff;
      background: var(--bmb-teal);
      box-shadow: 0 10px 28px rgba(38,177,177,0.35);
    }

    /* main spacing because nav fixed */
    main{ padding-top: 96px; min-height: 100vh; }

    /* sections */
    .hero{
      display:grid;
      grid-template-columns: 1fr;
      gap: 36px;
      align-items:center;
      padding: 64px 0;
    }
    .hero h1{
      font-size: clamp(40px, 5vw, 72px);
      line-height: 1.02;
      margin:0 0 18px;
      font-weight: 800;
    }
    .hero p{
      margin:0 0 26px;
      font-size: 18px;
      color: var(--muted);
      max-width: 54ch;
    }

    .hero-img{
      width:100%;
      height: 520px;
      border-radius: 60px;
      object-fit: cover;
      object-position: center;
      border: 16px solid rgba(255,255,255,1);
      box-shadow: var(--shadow);
    }
    html.dark .hero-img{ border-color: rgba(36,52,71,1); }

    /* video */
    .video{
      padding: 72px 0;
      background:#0f172a;
      text-align:center;
    }
    .video h2{ color:#fff; font-size: 28px; margin:0 0 24px; }
    .video-box{
      max-width: 896px;
      margin:0 auto;
      aspect-ratio: 16/9;
      border-radius: 28px;
      overflow:hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,0.55);
    }
    .video-box iframe{ width:100%; height:100%; border:0; }

    /* contact form section */
    .section-soft{
      padding: 80px 0;
      background: var(--bg-soft);
    }
    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 50px;
      box-shadow: var(--shadow);
      padding: 40px;
    }
    .card h2{ margin:0 0 8px; font-size: 28px; font-weight: 800; color: var(--bmb-navy); }
    html.dark .card h2{ color: var(--text); }
    .card p{ margin:0 0 22px; color: var(--muted); }

    .form-grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .input, .textarea{
      width:100%;
      padding: 14px 14px;
      border-radius: 18px;
      border: 0;
      outline:none;
      background: rgba(148,163,184,0.16);
      color: var(--text);
      transition: box-shadow .2s ease, background .2s ease;
    }
    .input:focus, .textarea:focus{ box-shadow: 0 0 0 3px rgba(38,177,177,0.35); }
    .textarea{ resize: vertical; min-height: 110px; }

    /* about */
    .about{
      display:grid;
      grid-template-columns: 1fr;
      gap: 36px;
      align-items:center;
      padding: 64px 0;
    }
    .about-img{
      width:100%;
      height: 700px;
      border-radius: 40px;
      object-fit: cover;
      object-position: top;
      border: 8px solid rgba(255,255,255,1);
      box-shadow: var(--shadow);
    }
    html.dark .about-img{ border-color: rgba(36,52,71,1); }
    .about h2{ margin:0 0 16px; font-size: 34px; font-weight: 800; }
    .about p{ color: var(--muted); font-size: 17px; line-height: 1.7; margin: 0 0 14px; }

    .info-box{
      margin-top: 18px;
      padding: 22px;
      border-left: 8px solid var(--bmb-teal);
      border-radius: 24px;
      background: rgba(38,177,177,0.10);
    }
    html.dark .info-box{ background: rgba(38,177,177,0.06); }
    .info-box h4{ margin:0 0 6px; font-size: 18px; color: var(--bmb-navy); }
    html.dark .info-box h4{ color: var(--bmb-teal); }
    .info-box p{ margin:0; font-style: italic; color: var(--muted); }

    /* catalog */
    .catalog{ padding: 44px 0; }
    .catalog h2{
      margin:0 0 26px;
      font-size: 34px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .product{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 24px;
      display:flex;
      flex-direction: column;
      gap: 18px;
      cursor:pointer;
      transition: transform .2s ease, box-shadow .25s ease;
    }
    .product:hover{ transform: translateY(-2px); box-shadow: var(--shadow2); }
    .product img{
      width:100%;
      height: 240px;
      border-radius: 28px;
      object-fit: cover;
      object-position: center;
      transition: transform .5s ease;
    }
    .product:hover img{ transform: scale(1.04); }
    .product h3{
      margin:0 0 6px;
      color: var(--bmb-teal);
      font-size: 26px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .product .variety{
      margin:0 0 10px;
      color: var(--bmb-navy);
      font-weight: 800;
      font-size: 18px;
    }
    html.dark .product .variety{ color: var(--text); }

    .detail-btn{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--bmb-teal);
      background: transparent;
      border:0;
      padding:0;
      cursor:pointer;
    }

    /* footer */
    footer{
      padding: 80px 0 36px;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }
    .footer-grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 28px;
    }
    .footer-bio{ color: var(--muted); font-size: 12px; line-height: 1.6; margin: 0 0 16px; }
    .footer-title{
      margin:0 0 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 12px;
      font-weight: 800;
      color: var(--bmb-navy);
    }
    html.dark .footer-title{ color: var(--bmb-teal); }
    .footer-text{ color: var(--muted); margin: 0 0 6px; }
    .footer-strong{ color: var(--text); font-weight: 800; }
    .footer-copy{
      margin-top: 40px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      text-align:center;
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .social{ display:flex; gap: 12px; }
    .social a{ display:inline-flex; transform: scale(1); transition: transform .2s ease; }
    .social a:hover{ transform: scale(1.08); }

    /* modal */
    #seed-modal{
      position:fixed;
      inset:0;
      z-index:100;
      display:none;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      padding: 16px;
      align-items:center;
      justify-content:center;
    }
    #seed-modal.show{ display:flex; }

    .modal{
      width:100%;
      max-width: 980px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 40px;
      box-shadow: 0 30px 100px rgba(0,0,0,0.50);
      position:relative;
      overflow:hidden;
    }
    .modal-close{
      position:absolute;
      top: 18px;
      right: 18px;
      width:44px;
      height:44px;
      border-radius: 999px;
      border:0;
      cursor:pointer;
      background: rgba(148,163,184,0.18);
      display:grid;
      place-items:center;
      transition: transform .2s ease;
      z-index:2;
    }
    .modal-close:hover{ transform: rotate(90deg); }
    .modal-content{
      padding: 32px;
      max-height: 85vh;
      overflow:auto;
    }
    .modal-grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 22px;
      align-items:start;
    }
    .modal-img{
      width:100%;
      height: 420px;
      border-radius: 40px;
      object-fit: contain;
      background: rgba(148,163,184,0.14);
      padding: 14px;
    }

    .mono-box{
      background: rgba(148,163,184,0.12);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      color: var(--muted);
      font-size: 13px;
      margin: 12px 0 18px;
    }
    .warn{
      background: rgba(239, 68, 68, 0.10);
      border-left: 8px solid rgb(239, 68, 68);
      border-radius: 18px;
      padding: 14px;
    }
    .warn h5{
      margin:0 0 6px;
      color: rgb(239, 68, 68);
      font-size: 11px;
      font-weight: 800;
      letter-spacing:.12em;
      text-transform: uppercase;
    }
    .warn p{ margin:0; color: var(--text); font-size: 12px; line-height: 1.5; opacity: .9; }

    /* responsive */
    @media (min-width: 768px){
      .nav-links{ display:flex; }
      .top-contact{ display:inline-flex; }
      .hero{ grid-template-columns: 1fr 1fr; }
      .about{ grid-template-columns: 1fr 1fr; }
      .form-grid{ grid-template-columns: 1fr 1fr; }
      .grid{ grid-template-columns: 1fr 1fr; gap: 22px; }
      .product{ flex-direction: row; align-items:center; }
      .product img{ width: 34%; height: 224px; }
      .footer-grid{ grid-template-columns: 1fr 1fr 1fr; gap: 48px; }
      .modal-grid{ grid-template-columns: 1fr 1fr; gap: 26px; }
    }
  </style>
</head>

    const THEME_KEY = "bmb_theme";

      const root = document.documentElement;

      root.classList.toggle("dark", isDark);
      root.style.colorScheme = isDark ? "dark" : "light";
      localStorage.setItem(THEME_KEY, isDark ? "dark" : "light");
      updateThemeIcon();
      lucide.createIcons();
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains("dark");
      setTheme(isDark ? "light" : "dark");
    }

    function updateThemeIcon() {
      const icon = document.getElementById("theme-icon");
      if (!icon) return;
      const isDark = document.documentElement.classList.contains("dark");

      en: {
        navHome: "Home", navAbout: "About", navCatalog: "Catalog", navContact: "Contact",
        heroTitle: "The Future Begins with Quality <span style='color: var(--bmb-teal)'>Seeds</span>.",
        heroDesc: "Center for modern solutions in seed production, calibration, and treatment.",
        btnHero: "Go to Catalog", videoTitle: "Watch Video",
        aboutTitle: "Strategic step in BMB Holding ecosystem",
        about1: "BMB Holding launched BMB EcoNav in January 2026 as part of its strategic growth program.",
        about2: "Goal: support farmers with high-yield seeds adapted to local soil.",
        dirTitle: "Director of BMB EcoNav", dirDesc: "PhD in Agricultural Sciences, Sabir Yuldashevich Egamberdiev.",
        catHeader: "Product Catalog", btnDetail: "Details",
        formTitle: "Contact Us", formSub: "Have questions? Leave your details below.",
        btnSubmit: "Submit", inpName: "Name", inpPhone: "Phone", inpMsg: "Message",
        recomTitle: "BUYER RECOMMENDATIONS", important: "IMPORTANT NOTICE",
        steps: ["Open the package only at planting time.", "Maintain proper spacing.", "Control soil moisture."],
        warning: "All intellectual property rights protected. Breeding or research use is prohibited.",
        pumpkin: "Pumpkin", cucumber: "Cucumber", tomato: "Tomato", pepper: "Bell Pepper",
        footerBio: "BMB EcoNav — BMB Holding’s innovative step in the agricultural sector.",
        footerContactTitle: "Contact",
        footerPhonesTitle: "Phones",
        footerAddress: "Tashkent, Yakkasaray district, Kichik Halqa road, 14-B",
        footerCopy: "© 2026 BMB ECO NAV | All Rights Reserved"
      }
    };

    const products = [
      { id: "pumpkin", key: "pumpkin", variety: "BOL QOVOG‘I ELITE", info: "Batch 6652098 | 100 g", coating: "Fludioxonil | Exp: 02-2028", img: "/assets/pumpkin.jpg" },
      { id: "cucumber", key: "cucumber", variety: "ELEGANT F1", info: "Batch 6652098 | 1000 seeds", coating: "Fludioxonil | Exp: 02-2028", img: "/assets/cucumber.jpg" },
      { id: "tomato", key: "tomato", variety: "7424 ELITE", info: "Batch 6652098 | 1000 seeds", coating: "Fludioxonil | Exp: 02-2028", img: "/assets/tomato.jpg" },
      { id: "pepper", key: "pepper", variety: "YOQUD F1", info: "Batch 6652098 | 50 g", coating: "Fludioxonil | Exp: 02-2028", img: "/assets/pepper.jpg" }
    ];

    function setActiveNav(page) {
      document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
      const el = document.getElementById(`nav-${page}`);
      if (el) el.classList.add('active');
    }

    function applyFooterTranslations() {
      const t = dict[currentLang];
      document.getElementById('footer-bio').innerText = t.footerBio;
      document.getElementById('footer-contact-title').innerText = t.footerContactTitle;
      document.getElementById('footer-phones-title').innerText = t.footerPhonesTitle;
      document.getElementById('footer-address').innerText = t.footerAddress;
      document.getElementById('footer-copy').innerText = t.footerCopy;
    }

    function navigateTo(page) {
      currentPage = page;
      const container = document.getElementById('page-content');
      const t = dict[currentLang];

      setActiveNav(page);

      document.getElementById('nav-home').innerText = t.navHome;
      document.getElementById('nav-about').innerText = t.navAbout;
      document.getElementById('nav-catalog').innerText = t.navCatalog;
      document.getElementById('btn-top-contact').innerText = t.navContact;

      applyFooterTranslations();

      if (page === 'home') {
        container.innerHTML = `
          <div class="fade">
            <section class="container hero">
              <div>
                <h1>${t.heroTitle}</h1>
                <p>${t.heroDesc}</p>
                <button class="btn btn-navy" onclick="navigateTo('catalog')">${t.btnHero}</button>
              </div>
              <img src="/assets/farmmain.jpg" class="hero-img" alt="Farm" />
            </section>

            <section class="video">
              <div class="container">
                <h2>${t.videoTitle}</h2>
                <div class="video-box">
                  <iframe src="https://www.youtube.com/embed/EC17XunxGz0" allowfullscreen></iframe>
                </div>
              </div>
            </section>

            <section class="section-soft">
              <div class="container" style="max-width: 896px;">
                <div class="card">
                  <h2>${t.formTitle}</h2>
                  <p>${t.formSub}</p>
                  <form id="tg-form">
                    <div class="form-grid">
                      <input type="text" id="inp-name" required placeholder="${t.inpName}" class="input" />
                      <input type="text" id="inp-phone" required placeholder="${t.inpPhone}" class="input" />
                    </div>
                    <textarea id="inp-msg" rows="4" placeholder="${t.inpMsg}" class="textarea"></textarea>
                    <div style="margin-top:14px;">
                      <button type="submit" class="btn btn-teal" style="border-radius:18px; padding: 14px 24px;">${t.btnSubmit}</button>
                    </div>
                  </form>
                </div>
              </div>
            </section>
          </div>
        `;
        bindForm();
      } else if (page === 'about') {
        container.innerHTML = `
          <div class="fade">
            <section class="container about">
              <img src="/assets/sobir_aka.webp" class="about-img" alt="Director" />
              <div>
                <h2>${t.aboutTitle}</h2>
                <p>${t.about1}</p>
                <p>${t.about2}</p>
                <div class="info-box">
                  <h4>${t.dirTitle}</h4>
                  <p>${t.dirDesc}</p>
                </div>
              </div>
            </section>
          </div>
        `;
      } else if (page === 'catalog') {
        container.innerHTML = `
          <div class="fade">
            <section class="container catalog">
              <h2>${t.catHeader}</h2>
              <div class="grid" id="catalog-grid"></div>
            </section>
          </div>
        `;
        renderCatalog();
      }

      lucide.createIcons();
      window.scrollTo(0, 0);
    }

    function renderCatalog() {
      const grid = document.getElementById('catalog-grid');
      grid.innerHTML = products.map(p => `
        <div class="product" onclick="openModal('${p.id}')">
          <img src="${p.img}" alt="${p.key}" />
          <div style="flex:1;">
            <h3>${dict[currentLang][p.key]}</h3>
            <p class="variety">${p.variety}</p>
            <button class="detail-btn">
              ${dict[currentLang].btnDetail} <i data-lucide="arrow-right" style="width:16px;height:16px;"></i>
            </button>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function openModal(id) {
      const p = products.find(x => x.id === id);
      const t = dict[currentLang];

      document.getElementById('modal-content').innerHTML = `
        <div class="modal-grid">
          <img src="${p.img}" class="modal-img" alt="${p.key}" />
          <div>
            <h2 style="margin:0 0 8px; font-size:34px; font-weight:800; text-transform:uppercase;">${t[p.key]}</h2>
            <p style="margin:0 0 10px; color: var(--bmb-teal); font-weight:800; font-size:22px;">${p.variety}</p>

            <div class="mono-box">
              ${p.info}<br/>${p.coating}
            </div>

            <h4 style="margin:0 0 10px; font-weight:800; text-transform:uppercase; font-size:12px; letter-spacing:.08em;">
              ${t.recomTitle}
            </h4>
            <ul style="margin:0 0 18px; padding-left: 18px; color: var(--muted);">
              ${t.steps.map(s => `<li style="margin: 10px 0;">${s}</li>`).join('')}
            </ul>

            <div class="warn">
              <h5>${t.important}</h5>
              <p>${t.warning}</p>
            </div>
          </div>
        </div>
      `;

      document.getElementById('seed-modal').classList.add('show');
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('seed-modal').classList.remove('show');
    }

    function bindForm() {
      const form = document.getElementById('tg-form');
      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text =
          `🌟 *Yangi xabar* 🌟\n` +
          `👤 *Ism:* ${document.getElementById('inp-name').value}\n` +
          `📞 *Tel:* ${document.getElementById('inp-phone').value}\n` +
          `💬 *Xabar:* ${document.getElementById('inp-msg').value}`;

        try {
          await fetch(`https://api.telegram.org/bot8258481366:AAHwxRFxpl092Wxkus3Ne-QLeg4HxBzmZ1g/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: "-4966032685", text: text, parse_mode: 'Markdown' })
          });
          alert("✅ Xabaringiz yuborildi!");
          e.target.reset();
        } catch (err) {
          alert("❌ Xatolik yuz berdi.");
        }
      });
    }

    function changeLanguage(l) {
      currentLang = l;
      navigateTo(currentPage);
    }

    const cursor = document.getElementById('seed-cursor');
    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    // close modal on outside click
    document.getElementById('seed-modal').addEventListener('click', (e) => {
      if (e.target.id === 'seed-modal') closeModal();
    });

    lucide.createIcons();
    navigateTo('home');
  </script>
</body>
</html>
